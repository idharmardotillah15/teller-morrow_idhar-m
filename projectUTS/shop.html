<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | TELLER MORROW</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="shop"><header id="idhar_header"></header>
<section class="idhar_page-banner"><div class="idhar_container"><h1 class="idhar_title">Shop</h1><p class="idhar_sub">Seluruh koleksi sepatu dan pakaian kami.</p></div></section><section class="idhar_section"><div class="idhar_container"><div class="idhar_toolbar"><input class="idhar_input" id="idhar_search" type="search" placeholder="Cari nama sepatu..."><select class="idhar_select" id="idhar_brand"></select><select class="idhar_select" id="idhar_cat"></select>
<select class="idhar_select" id="idhar_price"><option value="">Semua Harga</option><option value="0-1200000">&lt; Rp 1,2 jt</option><option value="1200000-1600000">Rp 1,2 - 1,6 jt</option><option value="1600000-9999999">&gt; Rp 1,6 jt</option></select>
<select class="idhar_select" id="idhar_sort"><option value="">Urutkan</option><option value="low">Harga Termurah</option><option value="high">Harga Termahal</option><option value="new">Produk Terbaru</option></select></div><p class="idhar_sub" id="idhar_result"></p><div class="idhar_grid" id="idhar_list"></div></div></section>
<footer id="idhar_footer"></footer><script src="js/script.js"></script></body></html>
